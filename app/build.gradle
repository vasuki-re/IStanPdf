plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'vasuki.istanpdf'
    compileSdk 36

    defaultConfig {
        applicationId 'vasuki.istanpdf'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.5-Mitsuba'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.itext7.kernel
    implementation libs.itext7.io
    implementation libs.itext7.layout
}
